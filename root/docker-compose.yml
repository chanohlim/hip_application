version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - springboot

  springboot:
    build: ./backend/springboot
    ports:
      - "8080:8080"
    depends_on:
      - fastapi

  fastapi:
    build: ./backend/fastapi
    ports:
      - "8000:8000"